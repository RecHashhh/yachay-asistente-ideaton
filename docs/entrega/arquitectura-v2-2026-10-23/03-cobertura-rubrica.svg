<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#27618e"></path></marker></defs><rect width="1920" height="1080" fill="white"></rect><g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="60" font-size="22" fill="#27618e" font-weight="700">YACHI · ARQUITECTURA Y EVIDENCIA · REVISIÓN 23-10-2026</text><text x="70" y="125" font-size="47" fill="#1d2b36" font-weight="700">Cobertura de la rúbrica: qué demostrar</text><text x="70" y="170" font-size="23" fill="#607482" font-weight="400">Una arquitectura cubre el diseño; el nivel excelente también exige paper, evaluación, adopción, costo y declaración de IA.</text><rect x="70" y="190" width="90" height="7" fill="#ef4035"></rect><rect x="160" y="190" width="90" height="7" fill="#f68735"></rect><rect x="250" y="190" width="90" height="7" fill="#f9c82b"></rect><rect x="340" y="190" width="90" height="7" fill="#64ae42"></rect><rect x="430" y="190" width="90" height="7" fill="#299dce"></rect><rect x="520" y="190" width="90" height="7" fill="#00b7aa"></rect><rect x="70" y="240" width="850" height="188" rx="16" fill="#edf3f7"></rect><path d="M70 240h850" stroke="#27618e" stroke-width="6"></path><text data-max-width="806" x="92" y="278" font-size="27" fill="#27618e" font-weight="700">1 · Rigor científico y metodología</text><text data-max-width="806" x="92" y="317" font-size="24" fill="#263744" font-weight="400">Paper IEEE: problema, estado del arte y método reproducible</text><text data-max-width="806" x="92" y="348" font-size="24" fill="#263744" font-weight="400">Justificar cada decisión con resultados y límites</text><text data-max-width="806" x="92" y="379" font-size="24" fill="#263744" font-weight="400">Pendiente: cerrar borrador, resultados recientes y referencias</text>
  <rect x="990" y="240" width="860" height="188" rx="16" fill="#edf3f7"></rect><path d="M990 240h860" stroke="#64ae42" stroke-width="6"></path><text data-max-width="816" x="1012" y="278" font-size="27" fill="#64ae42" font-weight="700">2 · Calidad técnica y adopción</text><text data-max-width="816" x="1012" y="317" font-size="24" fill="#263744" font-weight="400">Procedimientos + representatividad + ubicaciones del campus</text><text data-max-width="816" x="1012" y="348" font-size="24" fill="#263744" font-weight="400">Guías: qué, cómo, orden y documentos; portal actualizable</text><text data-max-width="816" x="1012" y="379" font-size="24" fill="#263744" font-weight="400">Evidencia: demo, repositorio público y responsables del piloto</text>
  <rect x="70" y="464" width="850" height="188" rx="16" fill="#edf3f7"></rect><path d="M70 464h850" stroke="#ef4035" stroke-width="6"></path><text data-max-width="806" x="92" y="502" font-size="27" fill="#ef4035" font-weight="700">3 · Mitigación y validación de veracidad</text><text data-max-width="806" x="92" y="541" font-size="24" fill="#263744" font-weight="400">Fuentes + citas + dominio + aclaración + «sin información»</text><text data-max-width="806" x="92" y="572" font-size="24" fill="#263744" font-weight="400">Set amplio: aciertos, rechazo, trazabilidad y revisión humana</text><text data-max-width="806" x="92" y="603" font-size="24" fill="#263744" font-weight="400">Cerrar regresiones recientes y probar comunicados pasados</text>
  <rect x="990" y="464" width="860" height="188" rx="16" fill="#edf3f7"></rect><path d="M990 464h860" stroke="#299dce" stroke-width="6"></path><text data-max-width="816" x="1012" y="502" font-size="27" fill="#299dce" font-weight="700">4 · Experiencia, idiomas y accesibilidad</text><text data-max-width="816" x="1012" y="541" font-size="24" fill="#263744" font-weight="400">ES / EN fluidos, primer uso intuitivo y respuesta percibida ágil</text><text data-max-width="816" x="1012" y="572" font-size="24" fill="#263744" font-weight="400">Medir primer evento útil y p50/p95; probar con estudiantes</text><text data-max-width="816" x="1012" y="603" font-size="24" fill="#263744" font-weight="400">Kichwa es valor agregado; voz y traducción requieren revisión</text>
  <rect x="70" y="688" width="850" height="188" rx="16" fill="#edf3f7"></rect><path d="M70 688h850" stroke="#f68735" stroke-width="6"></path><text data-max-width="806" x="92" y="726" font-size="27" fill="#f68735" font-weight="700">5 · Costo computacional completo</text><text data-max-width="806" x="92" y="765" font-size="24" fill="#263744" font-weight="400">CPU, RAM, almacenamiento, inferencia y supuestos explícitos</text><text data-max-width="806" x="92" y="796" font-size="24" fill="#263744" font-weight="400">Separar consulta, ingesta de correo y voz; normal vs. pico</text><text data-max-width="806" x="92" y="827" font-size="24" fill="#263744" font-weight="400">Medir tokens, gasto y carga; no usar placeholders OPT_*</text>
  <rect x="990" y="688" width="860" height="188" rx="16" fill="#edf3f7"></rect><path d="M990 688h860" stroke="#00b7aa" stroke-width="6"></path><text data-max-width="816" x="1012" y="726" font-size="27" fill="#00b7aa" font-weight="700">6 · IA documentada · 7 · Pitch</text><text data-max-width="816" x="1012" y="765" font-size="24" fill="#263744" font-weight="400">Herramientas, propósito y aporte humano frente al de IA</text><text data-max-width="816" x="1012" y="796" font-size="24" fill="#263744" font-weight="400">Problema → solución → validación → costo → impacto</text><text data-max-width="816" x="1012" y="827" font-size="24" fill="#263744" font-weight="400">Ensayar el tiempo y explicar decisiones ante el jurado</text>
  <rect x="70" y="916" width="1780" height="78" rx="16" fill="#27618e"></rect>
  <text x="95" y="948" font-size="22" fill="white" font-weight="700">CIERRE NECESARIO</text><text x="95" y="979" font-size="24" fill="white" font-weight="400">Integrar y activar → validar correo y horarios → repetir control ES/EN y costos → actualizar paper y slides</text>
 <text x="70" y="1036" font-size="20" fill="#607482" font-weight="400">Fuente: Rúbrica, p. 1; Reto, pp. 2–6 (objetivos, alcance, requisitos 8.1/8.2, metodología, entregables y uso de IA).</text></g></svg>