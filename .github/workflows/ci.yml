name: CI

# Verifica cada push y pull request: pruebas del backend (sin base ni clave de API), del frontend y del servicio de mapas.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # igual que api/Dockerfile
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Pruebas (sin base de datos ni ANTHROPIC_API_KEY)
        run: python -m pytest -q
      - name: Casos de filtros (crisis, denuncias, salud, insultos, datos personales)
        run: python -m app.filter_cases

  web:
    name: Web (tipos, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mapas:
    name: Mapas (PostGIS + pgRouting)
    runs-on: ubuntu-latest
    env:
      MAPS_DATABASE_URL: postgresql+psycopg://yachay_app:ci@localhost:5433/yachay_maps_test
      OSM_PATH: ${{ github.workspace }}/Mapa/YACHAY_FINAL.osm
    steps:
      - uses: actions/checkout@v4
      - name: Postgres del repositorio (PostGIS, pgRouting, pgvector)
        run: |
          docker build -t yachay-postgres Mapas/docker/postgres
          docker run -d --name pg -p 5433:5432 \
            -e POSTGRES_DB=yachay_maps -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=ci -e APP_DB_PASSWORD=ci \
            -v "$PWD/Mapas/docker/postgres/init:/docker-entrypoint-initdb.d:ro" yachay-postgres
          for i in $(seq 1 60); do
            docker exec pg psql -U postgres -d yachay_maps_test -tAc "select 1 from pg_extension where extname='unaccent'" 2>/dev/null | grep -q 1 && exit 0
            sleep 2
          done
          docker logs pg; exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Mapas/requirements*.txt
      - run: python -m pip install -r Mapas/requirements-dev.txt
      - working-directory: Mapas
        run: |
          alembic upgrade head
          python -m pytest -q
