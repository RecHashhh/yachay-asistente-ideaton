# Yachi completo: PostgreSQL + pgvector, migraciones e ingesta del corpus, y la API (grafo + agente con clave de Anthropic).
#   cp .env.example .env   # completar ADMIN_PASSWORD (≥ 12) y, si se quiere el agente, ANTHROPIC_API_KEY
#   copiar el corpus del equipo (confidencial, fuera del repo) a ./rag  → chunks.jsonl, fuentes.csv, corpus/, datos/, tramites.json
#   docker compose up --build
# Perfil opcional "ollama": la capa original de indexación con Ollama/bge-m3 y Alembic, en su propia base (yachay_rag).
services:
  db:
    build:
      context: ./Mapas/docker/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yachi}
      POSTGRES_USER: ${POSTGRES_USER:-yachay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_unified_data:/var/lib/postgresql
      - ./api/sql/docker:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Esquema (sql/*.sql), filtros, descripciones del catálogo y carga del corpus con embeddings (fastembed, sin GPU).
  seed:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sh", "-c", "cd /app/Mapas && alembic upgrade head && python -m app.importer --osm /data/YACHAY_FINAL.osm && cd /app && python -m app.migrate && python -m app.ingest"]
    environment: &api-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-yachay}:${POSTGRES_PASSWORD:-local-dev-only-change-me}@db:5432/${POSTGRES_DB:-yachi}
      MAPS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yachay}:${POSTGRES_PASSWORD:-local-dev-only-change-me}@db:5432/${POSTGRES_DB:-yachi}
      DATABASE_SCHEMA: maps
      RAG_DIR: /app/rag
      RAG_OPTIONAL: ${RAG_OPTIONAL:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_PRICING_USD_PER_MTOK_JSON: ${ANTHROPIC_PRICING_USD_PER_MTOK_JSON:-}
      GEO_LOCK_POOL_SIZE: ${GEO_LOCK_POOL_SIZE:-32}
      YACHI_AGENT: ${YACHI_AGENT:-auto}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.30}
      RAG_CONTEXT_CHUNKS: ${RAG_CONTEXT_CHUNKS:-8}
      RAG_MAX_TOOL_CALLS: ${RAG_MAX_TOOL_CALLS:-6}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5180}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
      # Capa original (perfil "ollama"): base aparte.
      POSTGRES_DB: yachay_rag
      POSTGRES_USER: ${POSTGRES_USER:-yachay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ./rag:/app/rag:ro
      - ./Mapa:/data:ro
      - model_cache:/app/.cache
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    logging: *default-logging

  # Crea la base configurada si falta en un volumen PostgreSQL ya existente.
  db-bootstrap:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["python", "-m", "app.bootstrap_db"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yachi}
      POSTGRES_USER: ${POSTGRES_USER:-yachay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./rag:/app/rag:ro
      - ./Mapa:/data:ro
      - model_cache:/app/.cache
      - uploads:/app/uploads
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    profiles: ["pilot"]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  grafana:
    profiles: ["pilot"]
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-this-pilot-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    logging: *default-logging

  # ---------------------------------------------------------------- perfil opcional: capa original con Ollama
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  ollama-model:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_EMBEDDING_MODEL:-bge-m3}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  seed-ollama:
    profiles: ["ollama"]
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: *api-environment
    volumes:
      - ./rag:/app/rag:ro
      - ./Mapa:/data:ro
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully
    restart: "no"
    logging: *default-logging

volumes:
  # Volumen histórico conservado para no borrar la base preexistente.
  postgres_data:
  postgres_unified_data:
  ollama_data:
  model_cache:
  uploads:
  prometheus_data:
  grafana_data:
