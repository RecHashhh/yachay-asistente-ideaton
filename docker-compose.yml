services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yachay_rag}
      POSTGRES_USER: ${POSTGRES_USER:-yachay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  ollama-model:
    image: ollama/ollama:latest
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${OLLAMA_EMBEDDING_MODEL:-bge-m3}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  seed:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment: &api-environment
      POSTGRES_DB: ${POSTGRES_DB:-yachay_rag}
      POSTGRES_USER: ${POSTGRES_USER:-yachay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.30}
      RAG_VECTOR_CANDIDATES: ${RAG_VECTOR_CANDIDATES:-20}
      RAG_CONTEXT_CHUNKS: ${RAG_CONTEXT_CHUNKS:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180,http://127.0.0.1:5180}
    volumes:
      - ./rag:/app/rag:ro
    depends_on:
      db:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    restart: "no"
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment: *api-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./rag:/app/rag:ro
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  ollama_data:
